name: Rolodex Prod Readiness

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  prod-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build, verify and tear down (the same command agents run)
        # Fresh stack, wait for /ready, smoke tests, failure-path checks, then removal.
        # The last line is a RESULT line; the exit code names the failing step.
        run: ./runner.sh test
      - name: Teardown
        if: always()
        run: ./runner.sh down
